name: update cargo deps

on:
  schedule:
    # 07:13 UTC daily. Off the hour so it does not queue behind the rush.
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Bumps @cargo-ai/cli and @cargo-ai/cdk to latest, proves the repo still
  # typechecks and lints against them, then opens a PR and merges it. The PR
  # is the record of what changed; the checks in this run are the gate, since
  # GitHub fires no `pull_request` workflows for a PR the default token opens.
  # Every `cargo-ai project init` scaffolds from main, so a bump left waiting
  # for review leaves new projects on the old toolchain.
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/cargo-deps
      CARGO_API_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: bump to latest
        run: |
          npm install --save-dev @cargo-ai/cli@latest
          npm install --save @cargo-ai/cdk@latest

      - name: stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo tooling is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same shape as typecheck.yml: generated workspace types sharpen the
      # check but are optional, so a repo with no CARGO_API_TOKEN still validates.
      - name: generate workspace types
        if: steps.diff.outputs.changed == 'true' && env.CARGO_API_TOKEN != ''
        run: npm run types

      - name: typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: lint
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: open and merge the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLI=$(node -p "require('./node_modules/@cargo-ai/cli/package.json').version")
          CDK=$(node -p "require('./node_modules/@cargo-ai/cdk/package.json').version")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "Bump @cargo-ai/cli to ${CLI} and @cargo-ai/cdk to ${CDK}"
          git push --force --set-upstream origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            cat > /tmp/body.md <<EOF
          Scheduled bump of the Cargo toolchain.

          | Package | Version |
          | --- | --- |
          | \`@cargo-ai/cli\` | ${CLI} |
          | \`@cargo-ai/cdk\` | ${CDK} |

          \`npm run typecheck\` and \`npm run lint\` passed against these versions
          in the run that opened this PR, which merges it right after. GitHub
          does not fire \`pull_request\` workflows for a PR opened with the
          default token, so the checks below stay empty: the run is the gate.
          Merging to main deploys.
          EOF

            gh pr create --base main --head "$BRANCH" \
              --title "Bump @cargo-ai/cli and @cargo-ai/cdk" \
              --body-file /tmp/body.md
          fi

          gh pr merge "$BRANCH" --merge --delete-branch
          echo "Merged @cargo-ai/cli ${CLI} and @cargo-ai/cdk ${CDK} into main." >> "$GITHUB_STEP_SUMMARY"
