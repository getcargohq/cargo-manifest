name: update cargo deps

on:
  schedule:
    # 07:13 UTC daily. Off the hour so it does not queue behind the rush.
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Bumps @cargo-ai/cli and @cargo-ai/cdk to latest, proves the repo still
  # typechecks against them, and opens a single PR. The branch name is stable,
  # so a run that finds a newer version force-pushes onto the open PR instead
  # of stacking a second one.
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/cargo-deps
      CARGO_API_KEY: ${{ secrets.CARGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: bump to latest
        run: |
          npm install --save-dev @cargo-ai/cli@latest
          npm install --save @cargo-ai/cdk@latest

      - name: stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo tooling is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same shape as typecheck.yml: generated workspace types sharpen the
      # check but are optional, so a repo with no CARGO_API_KEY still validates.
      - name: generate workspace types
        if: steps.diff.outputs.changed == 'true' && env.CARGO_API_KEY != ''
        run: npm run types

      - name: typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: open the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLI=$(node -p "require('./node_modules/@cargo-ai/cli/package.json').version")
          CDK=$(node -p "require('./node_modules/@cargo-ai/cdk/package.json').version")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "Bump @cargo-ai/cli to ${CLI} and @cargo-ai/cdk to ${CDK}"
          git push --force --set-upstream origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "Refreshed the open PR for $BRANCH." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > /tmp/body.md <<EOF
          Scheduled bump of the Cargo toolchain.

          | Package | Version |
          | --- | --- |
          | \`@cargo-ai/cli\` | ${CLI} |
          | \`@cargo-ai/cdk\` | ${CDK} |

          \`npm run typecheck\` passed against these versions in the run that
          opened this PR. GitHub does not fire \`pull_request\` workflows for a
          PR opened with the default token, so the checks below stay empty:
          that in-workflow typecheck is the gate. Merging to main deploys.
          EOF

          gh pr create --base main --head "$BRANCH" \
            --title "Bump @cargo-ai/cli and @cargo-ai/cdk" \
            --body-file /tmp/body.md
