# Prompt regression tests. Opt-in: set the OPENAI_API_KEY repo secret and
# remove the `if: false` line to enable.
name: evals

on:
  pull_request:
    paths:
      - "infra/agents/**"
      - "evals/**"

permissions:
  contents: read

jobs:
  evals:
    # Delete this line once OPENAI_API_KEY is configured as a repo secret.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
