# Prompt regression tests. Runs whenever an agent prompt or an eval suite
# changes, gated on the ANTHROPIC_API_KEY repo secret: set it in
# Settings > Secrets to turn the gate green, or the job skips cleanly.
name: evals

on:
  pull_request:
    paths:
      - "infra/agents/**"
      - "evals/**"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      # The secrets context isn't available in a job-level `if`, so guard here.
      - name: check ANTHROPIC_API_KEY
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY secret is not set; skipping evals. Add it in Settings > Secrets to run prompt regression tests on PRs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - if: steps.guard.outputs.enabled == 'true'
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
