name: context lint

on:
  pull_request:
    paths:
      - "context/**"
      - "outputs/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the staleness check sees real commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:context
      - run: npm run lint:outputs
