# Secret-free build check: the one workflow that runs on every repo, with or
# without a Cargo workspace connected. Catches lockfile drift (npm ci fails on
# a package.json/package-lock.json mismatch) and type errors in infra/ and
# scripts/ before they reach a deploy.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - name: install root tooling
        run: npm ci
      - name: typecheck scripts
        run: npx tsc --noEmit
      - name: install infra
        run: npm ci
        working-directory: infra
      - name: typecheck infra
        run: npm run typecheck
        working-directory: infra
